<html>
  <head>
    <meta charset="utf-8" />
    <script src="../include/globals.js"></script>
    <!-- main.css @imports theme.css, so linking theme.css here too would only
         fetch the tokens (and the BabyDoll font) a second time. -->
    <link rel="stylesheet" href="../main.css" />
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body class="melee">

    <div class="anim_container_outer">
      <div class="anim_container_inner">
        <div class="info container bottom fade_up">
          <div class="match"></div>
        </div>
        <div class="melee_row">
          <div class="p1 player container fade_right">
            <div class="name"></div>
            <div class="character_container"></div>
            <div class="score"></div>
          </div>
          <div class="p1 chips">
            <div class="pronoun chip fade_down_left_stagger"></div>
          </div>
          <div class="p2 player container fade_left">
            <div class="name"></div>
            <div class="character_container"></div>
            <div class="score"></div>
          </div>
          <div class="p2 chips">
            <div class="pronoun chip fade_down_right_stagger"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Slippi Bridge: no-ops when the bridge isn't running on port 5001 -->
    <script src="../shared/tsh-assets.js"></script>
    <script src="../shared/slippi-bridge-client.js"></script>
    <script src="index.js"></script>
  </body>
</html>
