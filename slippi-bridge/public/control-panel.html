<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stream Control</title>
  <style>
    :root {
      --bg: #14171c; --card: #1e232b; --card2: #262c36;
      --text: #e7ebf0; --dim: #9aa4b2; --line: #333b47;
      --ok: #35c26a; --bad: #e8524a; --warn: #e0a52b; --info: #4a9df0; --accent: #7a6cf0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 14px/1.45 "Segoe UI", system-ui, sans-serif; padding: 12px;
      -webkit-text-size-adjust: 100%;
    }
    .wrap { max-width: 1000px; margin: 0 auto; }
    h1 { font-size: 15px; margin: 0; letter-spacing: .04em; text-transform: uppercase; color: var(--dim); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 10px; }
    .row { display: flex; align-items: center; gap: 8px; }
    .between { justify-content: space-between; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 10px; flex-wrap: wrap; }
    .health { display: flex; gap: 14px; }
    .dot { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); }
    .dot::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--bad); box-shadow: 0 0 6px var(--bad); }
    .dot.up::before { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
    .label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin-bottom: 8px; }
    button {
      background: var(--card2); color: var(--text); border: 1px solid var(--line);
      border-radius: 6px; padding: 8px 12px; font-size: 13px; cursor: pointer;
      min-height: 44px;
    }
    button:hover:not(:disabled) { border-color: var(--info); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button.primary { background: #223a5e; border-color: #2f5486; }
    button.danger { background: #4a2320; border-color: #7a352f; }
    button.danger:hover:not(:disabled) { border-color: var(--bad); }
    button.wide { width: 100%; }
    button.mini { min-height: 0; padding: 3px 9px; font-size: 12px; }
    button.compact { min-height: 32px; padding: 6px 12px; font-size: 12px; }
    .stack { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
    .badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; text-transform: uppercase; letter-spacing: .04em; }
    .b-name { background: rgba(53,194,106,.18); color: var(--ok); }
    .b-character, .b-score { background: rgba(74,157,240,.18); color: var(--info); }
    .b-manual { background: rgba(122,108,240,.2); color: var(--accent); }
    .b-positional { background: rgba(224,165,43,.2); color: var(--warn); }
    .port-line { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--line); }
    .port-line:last-child { border-bottom: 0; }
    .team-tag { font-weight: 600; font-size: 13px; }
    .t1 { color: #ffb3a8; } .t2 { color: #a8c9ff; }
    .muted { color: var(--dim); font-size: 12px; }
    .score { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .vs { color: var(--dim); margin: 0 8px; }
    .set-teams { display: flex; align-items: center; justify-content: center; gap: 6px; text-align: center; margin: 4px 0 10px; }
    .confirm { background: var(--card2); border: 1px solid var(--warn); border-radius: 6px; padding: 10px; margin-top: 8px; }
    #toast { position: fixed; left: 12px; right: 12px; bottom: 12px; padding: 10px 12px; border-radius: 6px; font-size: 13px; display: none; z-index: 10; }
    #toast.ok { background: #17361f; border: 1px solid var(--ok); color: #b8f0c8; display: block; }
    #toast.err { background: #3a1c19; border: 1px solid var(--bad); color: #f5c2bd; display: block; }
    .hint { font-size: 11px; color: var(--dim); margin-top: 6px; }

    /* ── Upcoming sets ── */
    #set-filter {
      width: 100%; margin: 8px 0 0; padding: 9px 10px; font-size: 13px;
      background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px;
    }
    .sets-list { max-height: 46vh; overflow-y: auto; margin-top: 8px; -webkit-overflow-scrolling: touch; }
    .set-row {
      width: 100%; text-align: left; display: block; min-height: 52px;
      background: var(--card2); border: 1px solid var(--line); border-radius: 6px;
      padding: 8px 10px; margin-bottom: 6px; cursor: pointer;
    }
    .set-row:hover { border-color: var(--info); }
    .set-row.live { border-color: var(--accent); background: rgba(122,108,240,.12); cursor: default; }
    .set-row.live:hover { border-color: var(--accent); }
    .set-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 3px; }
    .set-meta .round { font-size: 12px; font-weight: 600; color: var(--text); }
    .set-meta .phase { font-size: 11px; color: var(--dim); }
    .chip { font-size: 10px; padding: 1px 6px; border-radius: 10px; background: rgba(255,255,255,.07); color: var(--dim); text-transform: uppercase; letter-spacing: .04em; }
    .chip.air { background: rgba(122,108,240,.25); color: #c3bcff; }
    .set-players { display: flex; align-items: baseline; gap: 8px; font-size: 13px; }
    .set-players .p { flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .set-players .p2 { text-align: right; }
    .set-players .seed { color: var(--dim); font-size: 11px; }
    .set-players .sc { font-variant-numeric: tabular-nums; color: var(--dim); font-size: 12px; flex: 0 0 auto; }
    .set-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; gap: 10px; }
    .set-footer .links { display: flex; gap: 12px; }
    .linkish { background: none; border: 0; color: var(--dim); font-size: 11px; text-decoration: underline; cursor: pointer; padding: 4px 0; min-height: 0; }
    .linkish:hover { color: var(--info); }

    /* Two columns once there's room — a laptop or tablet shouldn't get one
       narrow strip. The right-hand column spans both rows. */
    @media (min-width: 760px) {
      .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: start; }
      .cards .card { margin-bottom: 0; }
      .card-tall { grid-column: 2; grid-row: 1 / span 2; }
      .sets-list { max-height: 60vh; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <h1>Stream Control</h1>
      <div class="health">
        <span class="dot" id="dot-tsh">TSH</span>
        <span class="dot" id="dot-slippi">Slippi</span>
      </div>
    </div>

    <div class="cards">
      <!-- Current set + report -->
      <div class="card">
        <div class="label">Current Set</div>
        <div class="set-teams">
          <span class="team-tag t1" id="set-t1">—</span>
          <span class="score" id="score-1">0</span>
          <span class="vs">–</span>
          <span class="score" id="score-2">0</span>
          <span class="team-tag t2" id="set-t2">—</span>
        </div>
        <button class="wide danger" id="btn-report">Report to start.gg</button>
        <div id="report-confirm"></div>
        <div class="hint" id="report-hint"></div>
      </div>

      <!-- Port → Team -->
      <div class="card card-tall">
        <div class="row between">
          <div class="label" style="margin:0">Port → Team</div>
          <span class="badge b-positional" id="method-badge">—</span>
        </div>
        <div id="ports"></div>
        <div class="hint" id="tsh-swap-line" style="margin-top:8px"></div>
        <div class="stack" style="margin-top:10px">
          <button class="compact" id="btn-swap" title="Flip which Slippi port scores for which team">⇄ Swap Teams</button>
          <button class="compact" id="btn-swap-sides" title="Move both teams to the other side of the scoreboard in TSH">⇆ Switch Sides</button>
        </div>
        <div class="hint" id="swap-hint">Swap Teams (or Ctrl+Shift+S) fixes which port scores for which team. Switch Sides moves the names across the scoreboard. Amber = positional guess — verify before the game starts.</div>
      </div>

      <!-- Upcoming sets -->
      <div class="card">
        <div class="row between">
          <div class="label" style="margin:0">Upcoming Sets</div>
          <button class="mini" id="btn-refresh-sets" title="Refresh from start.gg">↻</button>
        </div>
        <input id="set-filter" type="search" placeholder="Filter by player or round…" style="display:none" />
        <div class="sets-list" id="sets-list"></div>
        <div class="set-footer">
          <div class="links">
            <button class="linkish" id="btn-toggle-finished">show finished</button>
            <button class="linkish" id="btn-pull" title="Pull the next queued stream set onto the scoreboard">pull next match</button>
          </div>
          <span class="muted" id="sets-stamp"></span>
        </div>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    const $ = (id) => document.getElementById(id);
    let status = null;

    // Served from the bridge (http://localhost:5001/control) relative URLs are
    // correct. Opened as a plain file — an OBS dock pointed at this .html — they
    // resolve against file:// and every request fails, so fall back to the
    // bridge's default address. Keep in sync with config.BRIDGE_PORT.
    const API_BASE = location.protocol.startsWith("http") ? "" : "http://localhost:5001";

    function toast(msg, ok) {
      const t = $("toast");
      t.textContent = msg;
      t.className = ok ? "ok" : "err";
      clearTimeout(toast._t);
      toast._t = setTimeout(() => { t.className = ""; t.style.display = "none"; }, 4000);
    }

    async function api(path, method = "POST", body) {
      try {
        const res = await fetch(API_BASE + path, {
          method,
          headers: body ? { "Content-Type": "application/json" } : undefined,
          body: body ? JSON.stringify(body) : undefined,
        });
        return await res.json();
      } catch (e) {
        return { ok: false, error: String(e) };
      }
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (c) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    // ── Status ──
    function render(s) {
      const prevSetId = status?.currentSet?.setId;
      status = s;
      $("dot-tsh").classList.toggle("up", !!s.tsh);
      $("dot-tsh").textContent = "TSH";
      const sl = $("dot-slippi");
      sl.classList.toggle("up", !!s.slippi);
      sl.textContent = "Slippi" + (s.slippiDetail?.mode ? " (" + s.slippiDetail.mode + ")" : "");

      // Port mapping
      const pm = s.portMapping || { method: "positional", ports: [] };
      const mb = $("method-badge");
      mb.textContent = pm.method || "—";
      mb.className = "badge b-" + (pm.method || "positional");
      const portsEl = $("ports");
      if (!pm.ports || pm.ports.length === 0) {
        portsEl.innerHTML = '<div class="muted">No game detected yet.</div>';
      } else {
        portsEl.innerHTML = pm.ports.map((p) => {
          const teamCls = p.team === 1 ? "t1" : p.team === 2 ? "t2" : "";
          const teamTxt = p.team ? "Team " + p.team : "(default)";
          return '<div class="port-line"><span class="muted">Port ' + (p.port + 1) + '</span>' +
                 '<span class="team-tag ' + teamCls + '">' + teamTxt +
                 (p.name ? ' · ' + escapeHtml(p.name) : "") + '</span></div>';
        }).join("");
      }

      // TSH's own Swap Teams flag. Shown so the operator can see that the
      // bridge noticed a swap made in TSH's UI rather than in this panel.
      const swapLine = $("tsh-swap-line");
      if (s.tshSwapped == null) {
        swapLine.textContent = "TSH swap state: unknown";
      } else if (s.tshSwapped) {
        swapLine.textContent = "TSH swap state: swapped — bridge mapping re-derived";
      } else {
        swapLine.textContent = "TSH swap state: normal";
      }

      // Current set
      const cs = s.currentSet || {};
      $("set-t1").textContent = cs.teamNames?.team1 || "Team 1";
      $("set-t2").textContent = cs.teamNames?.team2 || "Team 2";
      $("score-1").textContent = cs.scores?.team1 ?? 0;
      $("score-2").textContent = cs.scores?.team2 ?? 0;

      const btnReport = $("btn-report");
      btnReport.disabled = !cs.canReport;
      $("report-hint").textContent = cs.canReport
        ? "Set ID " + cs.setId + " — reports the live score as the result."
        : (cs.reason || "");

      // Only repaint the list when the loaded set actually changed — status
      // arrives every 2s and a blind repaint would fight the filter box.
      if (cs.setId !== prevSetId) renderSets();
    }

    // ── Upcoming sets ──
    let sets = [];            // last payload from /api/sets
    let setsError = null;     // fetch/TSH error, null when the last fetch was fine
    let showFinished = false;
    let pendingSet = null;    // set awaiting the overwrite confirm, null otherwise

    function currentSetId() {
      return status?.currentSet?.setId ?? null;
    }

    function setInProgress() {
      const sc = status?.currentSet?.scores;
      return Boolean(sc && (sc.team1 || sc.team2));
    }

    function filteredSets() {
      const f = $("set-filter").value.trim().toLowerCase();
      if (!f) return sets;
      return sets.filter((s) =>
        [s.p1_name, s.p2_name, s.round_name, s.tournament_phase]
          .some((v) => String(v ?? "").toLowerCase().includes(f)));
    }

    function renderSets() {
      const listEl = $("sets-list");
      const filterEl = $("set-filter");
      filterEl.style.display = sets.length > 8 ? "block" : "none";

      if (setsError) {
        listEl.innerHTML = '<div class="muted">Couldn\'t load sets: ' + escapeHtml(setsError) + "</div>";
        return;
      }
      if (sets.length === 0) {
        listEl.innerHTML = '<div class="muted">' + (showFinished
          ? "No sets returned. Is a tournament URL set in TSH?"
          : "No open sets — the bracket may be finished. Try “show finished”.") + "</div>";
        return;
      }

      const rows = filteredSets();
      if (rows.length === 0) {
        listEl.innerHTML = '<div class="muted">Nothing matches that filter.</div>';
        return;
      }

      const liveId = currentSetId();
      listEl.innerHTML = "";
      rows.forEach((set) => {
        const isLive = liveId != null && String(set.id) === String(liveId);
        const row = document.createElement("div");
        row.className = "set-row" + (isLive ? " live" : "");
        row.setAttribute("role", "button");

        const chips = [];
        if (isLive) chips.push('<span class="chip air">on air</span>');
        if (set.station) chips.push('<span class="chip">Stn. ' + escapeHtml(set.station) + "</span>");
        if (set.stream) chips.push('<span class="chip">stream</span>');

        const seed = (n) => (n == null ? "" : ' <span class="seed">(' + escapeHtml(n) + ")</span>");
        const t1 = Number(set.team1score) || 0, t2 = Number(set.team2score) || 0;
        const scoreTxt = (t1 > 0 || t2 > 0) ? t1 + "–" + t2 : "vs";

        row.innerHTML =
          '<div class="set-meta">' +
            '<span class="round">' + escapeHtml(set.round_name || "Set " + set.id) + "</span>" +
            (set.tournament_phase ? '<span class="phase">· ' + escapeHtml(set.tournament_phase) + "</span>" : "") +
            chips.join("") +
          "</div>" +
          '<div class="set-players">' +
            '<span class="p p1">' + escapeHtml(set.p1_name || "—") + seed(set.p1_seed) + "</span>" +
            '<span class="sc">' + scoreTxt + "</span>" +
            '<span class="p p2">' + escapeHtml(set.p2_name || "—") + seed(set.p2_seed) + "</span>" +
          "</div>";

        if (!isLive) row.onclick = () => requestLoad(set);
        listEl.appendChild(row);

        // Overwrite confirm renders inline under the row it belongs to.
        if (pendingSet && String(pendingSet.id) === String(set.id)) {
          listEl.appendChild(buildLoadConfirm(set));
        }
      });
    }

    function buildLoadConfirm(set) {
      const box = document.createElement("div");
      box.className = "confirm";
      box.innerHTML = "<div style='margin-bottom:8px'>The current set is at <b>" +
        (status?.currentSet?.scores?.team1 ?? 0) + "–" + (status?.currentSet?.scores?.team2 ?? 0) +
        "</b>. Loading this replaces it.</div>";
      const yes = document.createElement("button");
      yes.className = "danger"; yes.textContent = "Load anyway";
      yes.onclick = () => { pendingSet = null; loadSet(set); };
      const no = document.createElement("button");
      no.textContent = "Cancel"; no.style.marginLeft = "8px";
      no.onclick = () => { pendingSet = null; renderSets(); };
      box.appendChild(yes); box.appendChild(no);
      return box;
    }

    /** One tap loads, except when it would discard a set already in progress. */
    function requestLoad(set) {
      if (setInProgress()) {
        pendingSet = set;
        renderSets();
        return;
      }
      loadSet(set);
    }

    async function loadSet(set) {
      const r = await api("/api/load-set", "POST", { setId: set.id });
      toast(r.ok ? "Loaded " + (set.round_name || "set") : ("Load failed: " + r.error), r.ok);
      if (r.ok) fetchSets();
    }

    async function fetchSets() {
      const listEl = $("sets-list");
      if (sets.length === 0 && !setsError) listEl.innerHTML = '<div class="muted">Loading…</div>';
      const r = await api("/api/sets" + (showFinished ? "?finished=1" : ""), "GET");
      if (!r.ok) {
        setsError = r.error || "unknown error";
      } else {
        setsError = null;
        sets = r.data || [];
        pendingSet = null;
      }
      $("sets-stamp").textContent = setsError
        ? ""
        : sets.length + (showFinished ? " sets" : " open") + " · " +
          new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      renderSets();
    }

    // ── Actions ──
    $("btn-swap").onclick = async () => {
      const r = await api("/api/swap");
      toast(r.ok ? "Teams swapped" : ("Swap failed: " + r.error), r.ok);
    };

    // TSH's own Swap Teams — moves names and scores across the scoreboard. The
    // bridge's 2s poll sees the flag change and re-derives the port mapping.
    $("btn-swap-sides").onclick = async () => {
      const r = await api("/api/swap-sides");
      toast(r.ok ? "Sides switched" : ("Switch sides failed: " + r.error), r.ok);
    };

    $("btn-pull").onclick = async () => {
      const r = await api("/api/pull-stream");
      toast(r.ok ? "Pulled next match" : ("Pull failed: " + r.error), r.ok);
      if (r.ok) fetchSets();
    };

    $("btn-refresh-sets").onclick = () => fetchSets();
    $("set-filter").oninput = () => renderSets();

    $("btn-toggle-finished").onclick = () => {
      showFinished = !showFinished;
      $("btn-toggle-finished").textContent = showFinished ? "hide finished" : "show finished";
      fetchSets();
    };

    // Two-step confirm for reporting (avoids accidental publish to the live bracket)
    $("btn-report").onclick = () => {
      const cs = status?.currentSet;
      if (!cs || !cs.canReport) return;
      const t1 = cs.scores.team1, t2 = cs.scores.team2;
      const winner = t1 > t2 ? (cs.teamNames.team1 || "Team 1") : (cs.teamNames.team2 || "Team 2");
      const box = $("report-confirm");
      box.innerHTML = "";
      const c = document.createElement("div");
      c.className = "confirm";
      c.innerHTML = "<div style='margin-bottom:8px'>Report <b>" + escapeHtml(winner) +
        "</b> wins <b>" + t1 + "–" + t2 + "</b> to start.gg?</div>";
      const yes = document.createElement("button");
      yes.className = "danger"; yes.textContent = "Yes, report it";
      const no = document.createElement("button");
      no.textContent = "Cancel"; no.style.marginLeft = "8px";
      no.onclick = () => { box.innerHTML = ""; };
      yes.onclick = async () => {
        box.innerHTML = '<div class="muted">Reporting…</div>';
        const r = await api("/api/report");
        box.innerHTML = "";
        toast(r.ok ? ("Reported: " + r.winnerName + " " + r.score) : ("Report failed: " + r.error), r.ok);
        // The reported set leaves the open list, so the next one is one tap away.
        if (r.ok) fetchSets();
      };
      c.appendChild(yes); c.appendChild(no);
      box.appendChild(c);
    };

    // ── Live status ──
    // socket.io.js is loaded from API_BASE rather than a static <script> tag so
    // the file:// fallback above applies to it too.
    const sio = document.createElement("script");
    sio.src = API_BASE + "/socket.io/socket.io.js";
    sio.onload = () => {
      const socket = API_BASE ? io(API_BASE) : io();
      socket.on("control_status", render);
    };
    sio.onerror = () => toast("Can't reach the bridge at " + (API_BASE || location.origin), false);
    document.head.appendChild(sio);

    // Also fetch once on load in case we connect between pushes.
    api("/api/status", "GET").then((s) => { if (s && s.currentSet) render(s); });

    // Every refresh is a live paginated start.gg query on TSH's side, so this
    // stays slow and pauses entirely while the panel isn't on screen.
    fetchSets();
    setInterval(() => {
      if (document.visibilityState === "visible") fetchSets();
    }, 90000);
  </script>
</body>
</html>
