<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stream Control</title>
  <style>
    :root {
      --bg: #14171c; --card: #1e232b; --card2: #262c36;
      --text: #e7ebf0; --dim: #9aa4b2; --line: #333b47;
      --ok: #35c26a; --bad: #e8524a; --warn: #e0a52b; --info: #4a9df0; --accent: #7a6cf0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 14px/1.45 "Segoe UI", system-ui, sans-serif; padding: 12px;
      -webkit-text-size-adjust: 100%;
    }
    .wrap { max-width: 1000px; margin: 0 auto; }
    h1 { font-size: 15px; margin: 0; letter-spacing: .04em; text-transform: uppercase; color: var(--dim); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 10px; }
    .row { display: flex; align-items: center; gap: 8px; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 10px; flex-wrap: wrap; }
    .health { display: flex; gap: 14px; }
    .dot { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); }
    .dot::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--bad); box-shadow: 0 0 6px var(--bad); }
    .dot.up::before { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
    .label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin-bottom: 8px; }

    /* ── Collapsible cards ──
       The toggle is its own <button> rather than the whole header row, because
       two headers already carry a control (the method badge, the sets refresh)
       and a button can't nest a button. */
    .card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .head-toggle {
      display: flex; align-items: center; gap: 7px; flex: 1 1 auto; min-width: 0;
      background: none; border: 0; padding: 0; min-height: 32px; text-align: left; cursor: pointer;
    }
    .head-toggle:hover .label { color: var(--text); }
    .head-toggle .label { margin: 0; }
    .caret { color: var(--dim); font-size: 10px; transition: transform .15s ease; flex: 0 0 auto; }
    .card.collapsed .caret { transform: rotate(-90deg); }
    /* display:none, not a max-height transition — .sets-list is its own
       overflow-y scroller and an animated height would fight it. */
    .card.collapsed .card-body { display: none; }
    .card-body { margin-top: 8px; }
    button {
      background: var(--card2); color: var(--text); border: 1px solid var(--line);
      border-radius: 6px; padding: 8px 12px; font-size: 13px; cursor: pointer;
      min-height: 44px;
    }
    button:hover:not(:disabled) { border-color: var(--info); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button.primary { background: #223a5e; border-color: #2f5486; }
    button.danger { background: #4a2320; border-color: #7a352f; }
    button.danger:hover:not(:disabled) { border-color: var(--bad); }
    button.wide { width: 100%; }
    button.mini { min-height: 0; padding: 3px 9px; font-size: 12px; }
    button.compact { min-height: 32px; padding: 6px 12px; font-size: 12px; }
    /* Side by side while there's room; each button's 140px flex-basis makes them
       wrap to full-width rows on their own once the dock is squeezed narrower
       than the pair needs. */
    .btn-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .btn-row > button { flex: 1 1 140px; }
    .badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; text-transform: uppercase; letter-spacing: .04em; }
    .b-name { background: rgba(53,194,106,.18); color: var(--ok); }
    .b-character, .b-score { background: rgba(74,157,240,.18); color: var(--info); }
    .b-manual { background: rgba(122,108,240,.2); color: var(--accent); }
    .b-positional { background: rgba(224,165,43,.2); color: var(--warn); }
    .port-line { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--line); }
    .port-line:last-child { border-bottom: 0; }
    .team-tag { font-weight: 600; font-size: 13px; }
    .t1 { color: #ffb3a8; } .t2 { color: #a8c9ff; }
    .muted { color: var(--dim); font-size: 12px; }
    .score { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .vs { color: var(--dim); margin: 0 8px; }
    .set-teams { display: flex; align-items: center; justify-content: center; gap: 6px; text-align: center; margin: 4px 0 10px; }
    .confirm { background: var(--card2); border: 1px solid var(--warn); border-radius: 6px; padding: 10px; margin-top: 8px; }
    #toast { position: fixed; left: 12px; right: 12px; bottom: 12px; padding: 10px 12px; border-radius: 6px; font-size: 13px; display: none; z-index: 10; }
    #toast.ok { background: #17361f; border: 1px solid var(--ok); color: #b8f0c8; display: block; }
    #toast.err { background: #3a1c19; border: 1px solid var(--bad); color: #f5c2bd; display: block; }
    .hint { font-size: 11px; color: var(--dim); margin-top: 6px; }

    /* ── Upcoming sets ── */
    #set-filter {
      width: 100%; margin: 8px 0 0; padding: 9px 10px; font-size: 13px;
      background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px;
    }
    .sets-list { max-height: 46vh; overflow-y: auto; margin-top: 8px; -webkit-overflow-scrolling: touch; }
    .set-row {
      width: 100%; text-align: left; display: block; min-height: 52px;
      background: var(--card2); border: 1px solid var(--line); border-radius: 6px;
      padding: 8px 10px; margin-bottom: 6px; cursor: pointer;
    }
    .set-row:hover { border-color: var(--info); }
    .set-row.live { border-color: var(--accent); background: rgba(122,108,240,.12); cursor: default; }
    .set-row.live:hover { border-color: var(--accent); }
    .set-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 3px; }
    .set-meta .round { font-size: 12px; font-weight: 600; color: var(--text); }
    .set-meta .phase { font-size: 11px; color: var(--dim); }
    .chip { font-size: 10px; padding: 1px 6px; border-radius: 10px; background: rgba(255,255,255,.07); color: var(--dim); text-transform: uppercase; letter-spacing: .04em; }
    .chip.air { background: rgba(122,108,240,.25); color: #c3bcff; }
    .set-players { display: flex; align-items: baseline; gap: 8px; font-size: 13px; }
    .set-players .p { flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .set-players .p2 { text-align: right; }
    .set-players .seed { color: var(--dim); font-size: 11px; }
    .set-players .sc { font-variant-numeric: tabular-nums; color: var(--dim); font-size: 12px; flex: 0 0 auto; }
    .set-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; gap: 10px; }
    .set-footer .links { display: flex; gap: 12px; }
    .linkish { background: none; border: 0; color: var(--dim); font-size: 11px; text-decoration: underline; cursor: pointer; padding: 4px 0; min-height: 0; }
    .linkish:hover { color: var(--info); }

    /* ── Combo clipper ── */
    .clip-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; margin-top: 10px; }
    .clip-fields .full { grid-column: 1 / -1; }
    .field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .field > span { font-size: 11px; color: var(--dim); }
    .field input[type="text"], .field input[type="password"], .field input[type="number"] {
      width: 100%; padding: 7px 8px; font-size: 13px; min-height: 36px;
      background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px;
    }
    .field input:focus { outline: none; border-color: var(--info); }
    .check { flex-direction: row; align-items: center; gap: 7px; min-height: 36px; }
    .check input { width: 17px; height: 17px; accent-color: var(--info); flex: 0 0 auto; }
    .check span { font-size: 12px; color: var(--text); }
    .switch { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); flex: 0 0 auto; }
    .switch input { width: 17px; height: 17px; accent-color: var(--ok); }
    .clip-list { margin-top: 10px; max-height: 26vh; overflow-y: auto; }
    .clip-row {
      display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
      padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 12px;
    }
    .clip-row:last-child { border-bottom: 0; }
    .clip-row .when { color: var(--dim); font-variant-numeric: tabular-nums; flex: 0 0 auto; }
    .clip-row .what { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .clip-row.failed .what { color: var(--bad); }

    /* Two columns once there's room — a laptop or tablet shouldn't get one
       narrow strip. Multicolumn rather than an explicit grid: cards change
       height every time one is collapsed, and pinning a card to a fixed
       row/column leaves holes the moment they do. */
    @media (min-width: 760px) {
      .cards { columns: 2; column-gap: 10px; }
      .cards .card { break-inside: avoid; margin: 0 0 10px; display: inline-block; width: 100%; }
      .sets-list { max-height: 50vh; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <h1>Stream Control</h1>
      <div class="health">
        <span class="dot" id="dot-tsh">TSH</span>
        <span class="dot" id="dot-slippi">Slippi</span>
        <span class="dot" id="dot-obs" style="display:none">OBS</span>
        <button class="linkish" id="btn-collapse-all" title="Collapse or expand every section">collapse all</button>
      </div>
    </div>

    <div class="cards">
      <!-- Current set + report -->
      <div class="card" data-section="set">
        <div class="card-head">
          <button class="head-toggle"><span class="caret">▾</span><span class="label">Current Set</span></button>
        </div>
        <div class="card-body">
          <div class="set-teams">
            <span class="team-tag t1" id="set-t1">—</span>
            <span class="score" id="score-1">0</span>
            <span class="vs">–</span>
            <span class="score" id="score-2">0</span>
            <span class="team-tag t2" id="set-t2">—</span>
          </div>
          <button class="wide danger" id="btn-report">Report to start.gg</button>
          <div id="report-confirm"></div>
          <div class="hint" id="report-hint"></div>
        </div>
      </div>

      <!-- Port → Team -->
      <div class="card" data-section="ports">
        <div class="card-head">
          <button class="head-toggle"><span class="caret">▾</span><span class="label">Port → Team</span></button>
          <span class="badge b-positional" id="method-badge">—</span>
        </div>
        <div class="card-body">
          <div id="ports"></div>
          <div class="hint" id="tsh-swap-line" style="margin-top:8px"></div>
          <div class="btn-row" style="margin-top:10px">
            <button class="compact" id="btn-swap" title="Flip which Slippi port scores for which team">⇄ Swap Teams</button>
            <button class="compact" id="btn-swap-sides" title="Move both teams to the other side of the scoreboard in TSH">⇆ Switch Sides</button>
          </div>
          <div class="hint" id="swap-hint">Swap Teams (or Ctrl+Shift+S) fixes which port scores for which team. Switch Sides moves the names across the scoreboard. Amber = positional guess — verify before the game starts.</div>
        </div>
      </div>

      <!-- Upcoming sets -->
      <div class="card" data-section="sets">
        <div class="card-head">
          <button class="head-toggle"><span class="caret">▾</span><span class="label">Upcoming Sets</span></button>
          <button class="mini" id="btn-refresh-sets" title="Refresh from start.gg">↻</button>
        </div>
        <div class="card-body">
          <input id="set-filter" type="search" placeholder="Filter by player or round…" style="display:none" />
          <div class="sets-list" id="sets-list"></div>
          <div class="set-footer">
            <div class="links">
              <button class="linkish" id="btn-toggle-finished">show finished</button>
              <button class="linkish" id="btn-pull" title="Pull the next queued stream set onto the scoreboard">pull next match</button>
            </div>
            <span class="muted" id="sets-stamp"></span>
          </div>
        </div>
      </div>

      <!-- Combo clipper -->
      <div class="card" data-section="clipper">
        <div class="card-head">
          <button class="head-toggle"><span class="caret">▾</span><span class="label">Combo Clipper</span></button>
          <label class="switch" title="Detect combos and save the OBS replay buffer">
            <input type="checkbox" id="clip-enabled" /> on
          </label>
        </div>
        <div class="card-body">
          <div class="hint" id="clip-status">—</div>

          <!-- Rendered from CLIP_FIELDS below: the ids used to be written out
               here AND listed again in JS, and any drift between the two threw
               inside render(), which has no try/catch and freezes the panel. -->
          <div class="clip-fields" id="clip-fields"></div>

          <div class="row" style="margin-top:10px; gap:8px">
            <button class="compact primary" id="btn-clip-save">Save settings</button>
            <button class="compact" id="btn-clip-test" title="Save the replay buffer now — proves the OBS chain works">Test clip now</button>
          </div>
          <div class="hint" id="clip-hint"></div>
          <div class="clip-list" id="clip-list"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    const $ = (id) => document.getElementById(id);
    let status = null;

    // Served from the bridge (http://localhost:5001/control) relative URLs are
    // correct. Opened as a plain file — an OBS dock pointed at this .html — they
    // resolve against file:// and every request fails, so fall back to the
    // bridge's default address. Keep in sync with config.BRIDGE_PORT.
    const API_BASE = location.protocol.startsWith("http") ? "" : "http://localhost:5001";

    function toast(msg, ok) {
      const t = $("toast");
      t.textContent = msg;
      t.className = ok ? "ok" : "err";
      clearTimeout(toast._t);
      toast._t = setTimeout(() => { t.className = ""; t.style.display = "none"; }, 4000);
    }

    async function api(path, method = "POST", body) {
      try {
        const res = await fetch(API_BASE + path, {
          method,
          headers: body ? { "Content-Type": "application/json" } : undefined,
          body: body ? JSON.stringify(body) : undefined,
        });
        return await res.json();
      } catch (e) {
        return { ok: false, error: String(e) };
      }
    }

    /**
     * Fire an action and toast the outcome — the shape every button here shares.
     * @param {string} path
     * @param {string|((r:object)=>string)} okMsg  — toast text on success
     * @param {string} failLabel — prefixed to the error on failure
     * @param {object} [opts] — { body, method, then } (then runs only on success)
     */
    async function act(path, okMsg, failLabel, opts = {}) {
      const r = await api(path, opts.method || "POST", opts.body);
      toast(r.ok ? (typeof okMsg === "function" ? okMsg(r) : okMsg)
                 : (failLabel + ": " + r.error), r.ok);
      if (r.ok && opts.then) opts.then(r);
      return r;
    }

    /**
     * The inline confirm used before anything destructive (loading over a set in
     * progress, publishing a result to a live bracket).
     * @param {{ html: string, confirmLabel: string, onConfirm: Function, onCancel?: Function }} o
     * @returns {HTMLElement}
     */
    function confirmBox(o) {
      const box = document.createElement("div");
      box.className = "confirm";
      const msg = document.createElement("div");
      msg.style.marginBottom = "8px";
      msg.innerHTML = o.html;
      const yes = document.createElement("button");
      yes.className = "danger";
      yes.textContent = o.confirmLabel;
      yes.onclick = () => o.onConfirm(box);
      const no = document.createElement("button");
      no.textContent = "Cancel";
      no.style.marginLeft = "8px";
      no.onclick = () => o.onCancel?.();
      box.append(msg, yes, no);
      return box;
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (c) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    // ── Collapsible sections ──
    // The dock is often squeezed into a corner of OBS next to the preview, so
    // which sections are open is a per-operator layout choice worth keeping
    // across reloads (an OBS dock reloads whenever it's reopened).
    const COLLAPSE_KEY = "streamControl.collapsed";

    function loadCollapsed() {
      try {
        const raw = JSON.parse(localStorage.getItem(COLLAPSE_KEY));
        return new Set(Array.isArray(raw) ? raw : []);
      } catch (_e) {
        return new Set();
      }
    }

    function saveCollapsed(set) {
      try {
        localStorage.setItem(COLLAPSE_KEY, JSON.stringify([...set]));
      } catch (_e) {
        // Private-mode / storage-disabled: collapsing still works this session.
      }
    }

    let collapsed = loadCollapsed();

    function applyCollapsed() {
      document.querySelectorAll(".card[data-section]").forEach((card) => {
        const isShut = collapsed.has(card.dataset.section);
        card.classList.toggle("collapsed", isShut);
        const toggle = card.querySelector(".head-toggle");
        if (toggle) toggle.setAttribute("aria-expanded", String(!isShut));
      });
      const allShut = document.querySelectorAll(".card[data-section]").length === collapsed.size;
      $("btn-collapse-all").textContent = allShut ? "expand all" : "collapse all";
    }

    document.querySelectorAll(".card[data-section]").forEach((card) => {
      const toggle = card.querySelector(".head-toggle");
      if (!toggle) return;
      toggle.onclick = () => {
        const key = card.dataset.section;
        if (collapsed.has(key)) collapsed.delete(key); else collapsed.add(key);
        saveCollapsed(collapsed);
        applyCollapsed();
      };
    });

    $("btn-collapse-all").onclick = () => {
      const keys = [...document.querySelectorAll(".card[data-section]")].map((c) => c.dataset.section);
      collapsed = collapsed.size === keys.length ? new Set() : new Set(keys);
      saveCollapsed(collapsed);
      applyCollapsed();
    };

    applyCollapsed();

    // ── Status ──
    function render(s) {
      const prevSetId = status?.currentSet?.setId;
      status = s;
      // Labels are static markup; only the up/down class and tooltip change.
      $("dot-tsh").classList.toggle("up", !!s.tsh);
      const sl = $("dot-slippi");
      sl.classList.toggle("up", !!s.slippi);
      sl.title = s.slippiDetail?.detail || "";

      // Port mapping
      const pm = s.portMapping || { method: "positional", ports: [] };
      const mb = $("method-badge");
      mb.textContent = pm.method || "—";
      mb.className = "badge b-" + (pm.method || "positional");
      const portsEl = $("ports");
      if (!pm.ports || pm.ports.length === 0) {
        portsEl.innerHTML = '<div class="muted">No game detected yet.</div>';
      } else {
        portsEl.innerHTML = pm.ports.map((p) => {
          const teamCls = p.team === 1 ? "t1" : p.team === 2 ? "t2" : "";
          const teamTxt = p.team ? "Team " + p.team : "(default)";
          return '<div class="port-line"><span class="muted">Port ' + (p.port + 1) + '</span>' +
                 '<span class="team-tag ' + teamCls + '">' + teamTxt +
                 (p.name ? ' · ' + escapeHtml(p.name) : "") + '</span></div>';
        }).join("");
      }

      // TSH's own Swap Teams flag. Shown so the operator can see that the
      // bridge noticed a swap made in TSH's UI rather than in this panel.
      const swapLine = $("tsh-swap-line");
      if (s.tshSwapped == null) {
        swapLine.textContent = "TSH swap state: unknown";
      } else if (s.tshSwapped) {
        swapLine.textContent = "TSH swap state: swapped — bridge mapping re-derived";
      } else {
        swapLine.textContent = "TSH swap state: normal";
      }

      // Current set
      const cs = s.currentSet || {};
      $("set-t1").textContent = cs.teamNames?.team1 || "Team 1";
      $("set-t2").textContent = cs.teamNames?.team2 || "Team 2";
      $("score-1").textContent = cs.scores?.team1 ?? 0;
      $("score-2").textContent = cs.scores?.team2 ?? 0;

      const btnReport = $("btn-report");
      btnReport.disabled = !cs.canReport;
      $("report-hint").textContent = cs.canReport
        ? "Set ID " + cs.setId + " — reports the live score as the result."
        : (cs.reason || "");

      renderClipper(s.clipper);

      // Only repaint the list when the loaded set actually changed — status
      // arrives every 2s and a blind repaint would fight the filter box.
      if (cs.setId !== prevSetId) renderSets();
    }

    // ── Combo clipper ──
    // Every input here is edited by hand while status keeps arriving every 2s.
    // clipDirty latches on the first keystroke so a tick can't overwrite what's
    // being typed; saving clears it and the next tick resyncs from the bridge.
    let clipDirty = false;

    // Single source of truth for the clipper form: the markup, the read/write
    // loops and the dirty-tracking all derive from this. Key names must match
    // clipper-settings.js's field list exactly — the bridge validates and clamps
    // every value, so the min/max here are only a nicety for the number spinners.
    const CLIP_FIELDS = [
      { key: "minMoves",            label: "Min moves",             type: "number", min: 1, max: 50 },
      { key: "minDamage",           label: "Min damage %",          type: "number", min: 0, max: 999 },
      { key: "cooldownSec",         label: "Cooldown (s)",          type: "number", min: 0, max: 600 },
      { key: "saveDelayMs",         label: "Save delay (ms)",       type: "number", min: 0, max: 60000, step: 100 },
      { key: "maxComboDurationSec", label: "Max combo (s, 0 = off)", type: "number", min: 0, max: 480 },
      { key: "maxClipsPerGame",     label: "Max clips/game (0 = ∞)", type: "number", min: 0, max: 100 },
      { key: "requireKill",         label: "Only combos that kill",  type: "check" },
      { key: "autoStartBuffer",     label: "Auto-start OBS buffer",  type: "check" },
      { key: "notifySidePanel",     label: "Show a toast on the side panel", type: "check", full: true },
      { key: "obsUrl",              label: "OBS WebSocket URL",      type: "text", full: true, placeholder: "ws://127.0.0.1:4455" },
      { key: "obsPassword",         label: "OBS WebSocket password", type: "password", full: true, placeholder: "(blank if auth is off)" },
      { key: "clipFolder",          label: "Replay clip folder (for the OBS playlist script)", type: "text", full: true, placeholder: "C:\\Users\\…\\Videos" },
    ];

    (function buildClipFields() {
      $("clip-fields").innerHTML = CLIP_FIELDS.map((f) => {
        const cls = "field" + (f.type === "check" ? " check" : "") + (f.full ? " full" : "");
        const span = "<span>" + escapeHtml(f.label) + "</span>";
        if (f.type === "check") {
          return '<label class="' + cls + '"><input type="checkbox" id="clip-' + f.key + '" />' + span + "</label>";
        }
        const attrs = f.type === "number"
          ? ' min="' + f.min + '" max="' + f.max + '" step="' + (f.step ?? 1) + '"'
          : (f.placeholder ? ' placeholder="' + escapeHtml(f.placeholder) + '"' : "");
        return '<label class="' + cls + '">' + span +
               '<input type="' + f.type + '" id="clip-' + f.key + '"' + attrs + " /></label>";
      }).join("");
    })();

    const CLIP_NUMBER_FIELDS = CLIP_FIELDS.filter((f) => f.type === "number").map((f) => f.key);
    const CLIP_CHECK_FIELDS  = CLIP_FIELDS.filter((f) => f.type === "check").map((f) => f.key);
    const CLIP_TEXT_FIELDS   = CLIP_FIELDS.filter((f) => f.type === "text" || f.type === "password").map((f) => f.key);

    function renderClipper(c) {
      if (!c) return;
      const s = c.settings || {};

      $("dot-obs").style.display = s.enabled ? "" : "none";
      $("dot-obs").classList.toggle("up", !!c.obs?.connected);

      if (!clipDirty) {
        $("clip-enabled").checked = !!s.enabled;
        for (const f of CLIP_NUMBER_FIELDS) $("clip-" + f).value = s[f] ?? 0;
        for (const f of CLIP_CHECK_FIELDS)  $("clip-" + f).checked = !!s[f];
        for (const f of CLIP_TEXT_FIELDS)   $("clip-" + f).value = s[f] ?? "";
      }

      $("clip-status").textContent = clipperStatusText(c);
      renderClips(c.recentClips || []);
    }

    function clipperStatusText(c) {
      // Conversions only exist for singles, so say so rather than letting the
      // operator wait for clips that can't come. See combo-detector.js.
      if (!c.settings?.enabled) return "Off. Turn it on to detect combos and save OBS clips. Singles only — doubles has no combo data.";
      if (!c.obs?.connected) return c.obs?.lastError || "Connecting to OBS…";
      if (c.obs?.bufferActive === false) return "OBS connected, but the replay buffer is not running.";
      return "OBS connected, replay buffer running." +
             (c.clipsThisGame ? ` ${c.clipsThisGame} clip(s) this game.` : "");
    }

    function renderClips(clips) {
      const el = $("clip-list");
      if (!clips.length) { el.innerHTML = ""; return; }
      el.innerHTML = clips.slice(0, 5).map((c) => {
        const when = new Date(c.ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        const what = c.ok
          ? (c.playerName || "Clip") +
            (c.moveCount ? ` · ${c.moveCount} moves, ${c.damage}%` : "") +
            (c.file ? ` · ${c.file}` : "")
          : (c.error || "Save failed");
        return '<div class="clip-row' + (c.ok ? "" : " failed") + '">' +
               '<span class="what">' + escapeHtml(what) + "</span>" +
               '<span class="when">' + escapeHtml(when) + "</span></div>";
      }).join("");
    }

    function collectClipperSettings() {
      const out = { enabled: $("clip-enabled").checked };
      for (const f of CLIP_NUMBER_FIELDS) out[f] = Number($("clip-" + f).value);
      for (const f of CLIP_CHECK_FIELDS)  out[f] = $("clip-" + f).checked;
      for (const f of CLIP_TEXT_FIELDS)   out[f] = $("clip-" + f).value;
      return out;
    }

    [...CLIP_NUMBER_FIELDS, ...CLIP_TEXT_FIELDS].forEach((f) => {
      $("clip-" + f).oninput = () => { clipDirty = true; };
    });
    CLIP_CHECK_FIELDS.forEach((f) => {
      $("clip-" + f).onchange = () => { clipDirty = true; };
    });

    // The master switch applies immediately — it's the one control an operator
    // reaches for mid-set, and making them press Save too invites a dead toggle.
    $("clip-enabled").onchange = () => {
      const enabled = $("clip-enabled").checked;
      act("/api/clipper/toggle", enabled ? "Combo clipper on" : "Combo clipper off",
          "Couldn't change it", { body: { enabled } });
    };

    $("btn-clip-save").onclick = async () => {
      const r = await api("/api/clipper/settings", "POST", collectClipperSettings());
      clipDirty = false;
      // save() reports ok:false when only the disk write failed — the settings
      // are live either way, so the message has to distinguish the two. That's
      // why this doesn't go through act().
      toast(r.ok ? "Clipper settings saved" : (r.error || "Save failed"), r.ok);
      if (r.settings) renderClipper({ ...(status?.clipper || {}), settings: r.settings });
    };

    $("btn-clip-test").onclick = async () => {
      $("clip-hint").textContent = "Asking OBS to save the buffer…";
      const r = await api("/api/clipper/test");
      $("clip-hint").textContent = r.ok
        ? "Saved" + (r.clip?.file ? ": " + r.clip.file : " (OBS reported no path)")
        : (r.error || "Test failed");
      toast(r.ok ? "Test clip saved" : ("Test clip failed: " + r.error), r.ok);
    };

    // ── Upcoming sets ──
    let sets = [];            // last payload from /api/sets
    let setsError = null;     // fetch/TSH error, null when the last fetch was fine
    let showFinished = false;
    let pendingSet = null;    // set awaiting the overwrite confirm, null otherwise

    function currentSetId() {
      return status?.currentSet?.setId ?? null;
    }

    function setInProgress() {
      const sc = status?.currentSet?.scores;
      return Boolean(sc && (sc.team1 || sc.team2));
    }

    function filteredSets() {
      const f = $("set-filter").value.trim().toLowerCase();
      if (!f) return sets;
      return sets.filter((s) =>
        [s.p1_name, s.p2_name, s.round_name, s.tournament_phase]
          .some((v) => String(v ?? "").toLowerCase().includes(f)));
    }

    function renderSets() {
      const listEl = $("sets-list");
      const filterEl = $("set-filter");
      filterEl.style.display = sets.length > 8 ? "block" : "none";

      if (setsError) {
        listEl.innerHTML = '<div class="muted">Couldn\'t load sets: ' + escapeHtml(setsError) + "</div>";
        return;
      }
      if (sets.length === 0) {
        listEl.innerHTML = '<div class="muted">' + (showFinished
          ? "No sets returned. Is a tournament URL set in TSH?"
          : "No open sets — the bracket may be finished. Try “show finished”.") + "</div>";
        return;
      }

      const rows = filteredSets();
      if (rows.length === 0) {
        listEl.innerHTML = '<div class="muted">Nothing matches that filter.</div>';
        return;
      }

      const liveId = currentSetId();
      listEl.innerHTML = "";
      rows.forEach((set) => {
        const isLive = liveId != null && String(set.id) === String(liveId);
        const row = document.createElement("div");
        row.className = "set-row" + (isLive ? " live" : "");
        row.setAttribute("role", "button");

        const chips = [];
        if (isLive) chips.push('<span class="chip air">on air</span>');
        if (set.station) chips.push('<span class="chip">Stn. ' + escapeHtml(set.station) + "</span>");
        if (set.stream) chips.push('<span class="chip">stream</span>');

        const seed = (n) => (n == null ? "" : ' <span class="seed">(' + escapeHtml(n) + ")</span>");
        const t1 = Number(set.team1score) || 0, t2 = Number(set.team2score) || 0;
        const scoreTxt = (t1 > 0 || t2 > 0) ? t1 + "–" + t2 : "vs";

        row.innerHTML =
          '<div class="set-meta">' +
            '<span class="round">' + escapeHtml(set.round_name || "Set " + set.id) + "</span>" +
            (set.tournament_phase ? '<span class="phase">· ' + escapeHtml(set.tournament_phase) + "</span>" : "") +
            chips.join("") +
          "</div>" +
          '<div class="set-players">' +
            '<span class="p p1">' + escapeHtml(set.p1_name || "—") + seed(set.p1_seed) + "</span>" +
            '<span class="sc">' + scoreTxt + "</span>" +
            '<span class="p p2">' + escapeHtml(set.p2_name || "—") + seed(set.p2_seed) + "</span>" +
          "</div>";

        if (!isLive) row.onclick = () => requestLoad(set);
        listEl.appendChild(row);

        // Overwrite confirm renders inline under the row it belongs to.
        if (pendingSet && String(pendingSet.id) === String(set.id)) {
          listEl.appendChild(buildLoadConfirm(set));
        }
      });
    }

    function buildLoadConfirm(set) {
      return confirmBox({
        html: "The current set is at <b>" +
          (status?.currentSet?.scores?.team1 ?? 0) + "–" +
          (status?.currentSet?.scores?.team2 ?? 0) + "</b>. Loading this replaces it.",
        confirmLabel: "Load anyway",
        onConfirm: () => { pendingSet = null; loadSet(set); },
        onCancel:  () => { pendingSet = null; renderSets(); },
      });
    }

    /** One tap loads, except when it would discard a set already in progress. */
    function requestLoad(set) {
      if (setInProgress()) {
        pendingSet = set;
        renderSets();
        return;
      }
      loadSet(set);
    }

    function loadSet(set) {
      return act("/api/load-set", "Loaded " + (set.round_name || "set"), "Load failed",
                 { body: { setId: set.id }, then: fetchSets });
    }

    async function fetchSets() {
      const listEl = $("sets-list");
      if (sets.length === 0 && !setsError) listEl.innerHTML = '<div class="muted">Loading…</div>';
      const r = await api("/api/sets" + (showFinished ? "?finished=1" : ""), "GET");
      if (!r.ok) {
        setsError = r.error || "unknown error";
      } else {
        setsError = null;
        sets = r.data || [];
        pendingSet = null;
      }
      $("sets-stamp").textContent = setsError
        ? ""
        : sets.length + (showFinished ? " sets" : " open") + " · " +
          new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      renderSets();
    }

    // ── Actions ──
    $("btn-swap").onclick = () => act("/api/swap", "Teams swapped", "Swap failed");

    // TSH's own Swap Teams — moves names and scores across the scoreboard. The
    // bridge's 2s poll sees the flag change and re-derives the port mapping.
    $("btn-swap-sides").onclick = () =>
      act("/api/swap-sides", "Sides switched", "Switch sides failed");

    $("btn-pull").onclick = () =>
      act("/api/pull-stream", "Pulled next match", "Pull failed", { then: fetchSets });

    $("btn-refresh-sets").onclick = () => fetchSets();
    $("set-filter").oninput = () => renderSets();

    $("btn-toggle-finished").onclick = () => {
      showFinished = !showFinished;
      $("btn-toggle-finished").textContent = showFinished ? "hide finished" : "show finished";
      fetchSets();
    };

    // Two-step confirm for reporting (avoids accidental publish to the live bracket)
    $("btn-report").onclick = () => {
      const cs = status?.currentSet;
      if (!cs || !cs.canReport) return;
      const t1 = cs.scores.team1, t2 = cs.scores.team2;
      const winner = t1 > t2 ? (cs.teamNames.team1 || "Team 1") : (cs.teamNames.team2 || "Team 2");
      const box = $("report-confirm");
      box.innerHTML = "";
      box.appendChild(confirmBox({
        html: "Report <b>" + escapeHtml(winner) + "</b> wins <b>" + t1 + "–" + t2 + "</b> to start.gg?",
        confirmLabel: "Yes, report it",
        onCancel: () => { box.innerHTML = ""; },
        onConfirm: async () => {
          box.innerHTML = '<div class="muted">Reporting…</div>';
          // The reported set leaves the open list, so the next one is one tap away.
          await act("/api/report", (r) => "Reported: " + r.winnerName + " " + r.score,
                    "Report failed", { then: fetchSets });
          box.innerHTML = "";
        },
      }));
    };

    // ── Live status ──
    // socket.io.js is loaded from API_BASE rather than a static <script> tag so
    // the file:// fallback above applies to it too.
    const sio = document.createElement("script");
    sio.src = API_BASE + "/socket.io/socket.io.js";
    sio.onload = () => {
      const socket = API_BASE ? io(API_BASE) : io();
      socket.on("control_status", render);
    };
    sio.onerror = () => toast("Can't reach the bridge at " + (API_BASE || location.origin), false);
    document.head.appendChild(sio);

    // No status fetch on load: the bridge pushes control_status to every socket
    // as it connects, so one would only duplicate a TSH round-trip per reload —
    // and an OBS dock reloads every time it's reopened.

    // Every refresh is a live paginated start.gg query on TSH's side, so this
    // stays slow and pauses entirely while the panel isn't on screen.
    fetchSets();
    setInterval(() => {
      if (document.visibilityState === "visible") fetchSets();
    }, 90000);
  </script>
</body>
</html>
