<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Side panel</title>
    <link rel="stylesheet" href="/o/shared/overlay.css" />
    <link rel="stylesheet" href="/o/side-panel/side-panel.css" />
  </head>
  <!-- 611 × 1080, beside the webcam. ?animate=false stills the theme pack's
       background flair; ?panel=<id> holds one panel (for styling). -->
  <body>

    <!-- Rounded corners for the cam cutout: an outward spread shadow in the
         surface colour paints over the cam's square corners. -->
    <div class="cam-overlay"></div>

    <!-- The surface around the cam cutout. Where none of these (or the cards)
         cover, the source is transparent and the OBS cam shows through. -->
    <div class="bg-top"></div>
    <div class="bg-bottom"></div>
    <div class="bg-left"></div>
    <div class="bg-right"></div>

    <div class="header-card">
      <span class="tournament-name"></span>
    </div>

    <div class="bottom-card">
      <div class="slot-light"></div>
      <div class="slot-grain"></div>
      <div class="slot-vignette"></div>

      <!-- Background flair: empty slots the theme pack draws in (its
           flair.css). See "Flair slots" in shared/overlay.css. -->
      <div class="flair flair-card"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>

      <div class="slot-logo">
        <div class="logo-stage">
          <!-- Divs with a background-image, not <img>: the theme pack's
               --logo-url / --sponsor-url resolve in CSS (see side-panel.css). -->
          <div class="logo-img logo-primary"></div>
          <div class="logo-img logo-sponsor"></div>
        </div>
      </div>

      <div class="panel-slot-content">

        <div class="info-panel" id="panel-player-1">
          <div class="player-identity">
            <div class="player-tag"></div>
            <div class="player-char-name"></div>
          </div>
          <div class="panel-header">Current Run</div>
          <div class="run-list"></div>
          <div class="panel-header">Recent Results</div>
          <div class="history-list"></div>
        </div>

        <div class="info-panel" id="panel-player-2">
          <div class="player-identity">
            <div class="player-tag"></div>
            <div class="player-char-name"></div>
          </div>
          <div class="panel-header">Current Run</div>
          <div class="run-list"></div>
          <div class="panel-header">Recent Results</div>
          <div class="history-list"></div>
        </div>

        <div class="info-panel" id="panel-recent-sets">
          <div class="panel-header">Recent Sets</div>
          <div class="sets-list"></div>
        </div>

        <div class="info-panel" id="panel-completed-sets">
          <div class="panel-header">Just Finished</div>
          <div class="completed-list"></div>
        </div>

      </div>

      <!-- Slides in over this card's bottom edge when a combo clip is saved;
           the card's overflow:hidden hides it at rest. -->
      <div class="clip-toast">
        <span class="clip-toast-icon">●</span>
        <span class="clip-toast-label">Clip Saved</span>
        <span class="clip-toast-detail"></span>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/o/shared/overlay-client.js"></script>
    <script src="/o/side-panel/side-panel.js"></script>
  </body>
</html>
