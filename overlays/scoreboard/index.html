<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Scoreboard</title>
    <link rel="stylesheet" href="/o/shared/overlay.css" />
    <link rel="stylesheet" href="/o/scoreboard/scoreboard.css" />
  </head>
  <!-- The Melee scoreboard: two player cards with character icon and score,
       the best-of pill between them, pronoun chips beneath, and the round
       card. 1920×1080. -->
  <body class="melee">
    <div class="stage">
      <div class="info container bottom fade_up">
        <div class="match">
          <span class="text round"></span>
        </div>
      </div>
      <div class="melee_row">
        <div class="p1 player container fade_right" data-side="0">
          <div class="name"><span class="text"></span></div>
          <div class="character_container"></div>
          <div class="score"><span class="text"></span></div>
        </div>
        <div class="p1 chips" data-side="0">
          <div class="pronoun chip fade"><span class="text"></span></div>
        </div>
        <div class="p2 player container fade_left" data-side="1">
          <div class="name"><span class="text"></span></div>
          <div class="character_container"></div>
          <div class="score"><span class="text"></span></div>
        </div>
        <div class="p2 chips" data-side="1">
          <div class="pronoun chip fade"><span class="text"></span></div>
        </div>
        <div class="best-of-pill fade"><span class="text"></span></div>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/o/shared/overlay-client.js"></script>
    <script src="/o/scoreboard/scoreboard.js"></script>
  </body>
</html>
