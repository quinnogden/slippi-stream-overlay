       own pages. ?animate=false switches without a crossfade or glide. -->

        <div class="title-main"><span class="text"></span></div>
        <div class="title-sub"><span class="text"></span></div>
      </div>
    </header>

    <nav class="page-dots empty"></nav>

    <main class="viewport fade"></main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/o/shared/overlay-client.js"></script>
